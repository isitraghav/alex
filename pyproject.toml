[project]
name = "alex"
version = "0.1.0"
description = "LLM tool-use benchmark: a constant prompt suite over financial-data tools, scored by rules (NVIDIA NIM)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",           # NVIDIA NIM is OpenAI-compatible (integrate.api.nvidia.com/v1)
    "pydantic-settings>=2.3", # config from .env
    "yfinance>=0.2.40",       # free prices / fundamentals
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",         # FRED, SEC EDGAR, Finnhub REST
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
alex = "alex.bench:main"
alex-bench = "alex.bench:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alex"]
